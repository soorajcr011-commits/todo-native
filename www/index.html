<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
<title>To Do List</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#141414" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app {
    height: 100dvh; width: 100%;
    background: #141414;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header { padding: 22px 22px 10px 22px; flex-shrink: 0; }
  header h1 {
    color: #F4F3EF; font-size: 26px; font-weight: 700;
    letter-spacing: -0.02em; margin: 0;
  }
  #list {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px 14px;
    display: flex; flex-direction: column; gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .row-wrap {
    position: relative; height: 72px; border-radius: 16px;
    overflow: hidden; flex-shrink: 0;
  }
  .reveal {
    position: absolute; inset: 0; display: flex; align-items: center;
  }
  .reveal.right { justify-content: flex-start; padding-left: 18px; background: #2E8A57; }
  .reveal.left { justify-content: flex-end; padding-right: 18px; background: #C0473A; }
  .row {
    position: relative; height: 100%; background: #1F1F1F;
    border: 1px solid transparent; border-radius: 16px;
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    touch-action: none; user-select: none; cursor: grab;
  }
  .emoji-slot { width: 26px; height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .task-text {
    flex: 1; color: #F4F3EF; font-size: 15px; line-height: 19px; font-weight: 400;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  #undo-toast {
    position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%);
    background: #1F1F1F; border: 1px solid #2E2E2E; border-radius: 999px;
    padding: 8px 16px; display: none; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 50;
  }
  #undo-toast.show { display: flex; animation: toastIn 0.18s ease-out; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(6px);} to { opacity: 1; transform: translateX(-50%) translateY(0);} }
  #undo-btn { background: none; border: none; padding: 0; display: flex; cursor: pointer; }
  footer { padding: 12px 14px 22px 14px; flex-shrink: 0; }
  .input-bar {
    display: flex; align-items: center; background: #1B1B1B;
    border: 1px solid #2A2A2A; border-radius: 999px; padding: 6px 6px 6px 18px; gap: 8px;
  }
  #task-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #F4F3EF; font-size: 15px;
  }
  #task-input::placeholder { color: #6E6E6E; font-style: italic; }
  #add-btn {
    width: 36px; height: 36px; border-radius: 50%; background: #F4F3EF; border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  #emoji-toggle {
    width: 34px; height: 34px; border-radius: 50%; background: transparent; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  #emoji-panel {
    display: none; overflow-x: auto; white-space: nowrap; gap: 6px;
    padding: 4px 4px 10px 4px; -webkit-overflow-scrolling: touch;
  }
  #emoji-panel.show { display: flex; }
  #emoji-panel button {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px;
    background: #1B1B1B; border: 1px solid #2A2A2A; font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header><h1>To Do List</h1></header>
  <div id="list"></div>
  <footer>
    <div id="emoji-panel"></div>
    <div class="input-bar">
      <button id="emoji-toggle" aria-label="Choose emoji">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="9" cy="10" r="0.7" fill="#9a9a9a" stroke="none"/>
          <circle cx="15" cy="10" r="0.7" fill="#9a9a9a" stroke="none"/>
          <path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8"/>
        </svg>
      </button>
      <input id="task-input" placeholder="List What To Do..." />
      <button id="add-btn" aria-label="Add task">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </footer>
  <div id="undo-toast">
    <button id="undo-btn" aria-label="Undo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F3EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    </button>
  </div>
</div>

<script>
const ROW_HEIGHT = 72;
const ROW_GAP = 8; // matches the `gap` set on #list — must be included in reorder math
const ROW_PITCH = ROW_HEIGHT + ROW_GAP; // true vertical distance between two rows' positions
const DEMO_TASKS = [
  { id: "demo1", text: "Finish maths homework", icon: "📚" },
  { id: "demo2", text: "Buy groceries for the week", icon: "🛒" },
];

const STORAGE_KEY = "todo-list-tasks";

function loadTasks() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved !== null) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (e) {}
  return [...DEMO_TASKS];
}

function saveTasks() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch (e) {}
}

let tasks = loadTasks();
let lastRemoved = null; // { task, index }
let undoTimer = null;
let uid = 1;
let activeGestureId = null; // guards against two rows ever handling a gesture simultaneously

const EMOJI_PICKER = [
  "✅", "📚", "✍️", "📝", "💻", "📞", "🤝", "📅",
  "⏰", "🛒", "📦", "🧾", "💳", "🍳", "☕", "🍽️",
  "🥗", "🧹", "🧺", "🔧", "🗑️", "🏠", "🪴", "🚗",
  "⛽", "✈️", "🚌", "🧳", "💊", "🏋️", "🧘", "🩺",
  "😴", "🚿", "💧", "🚶", "💰", "🎉", "🎁", "🎂",
  "💬", "🐾", "🎵", "🎮", "📷", "🎨", "👕", "🔑",
  "⚕️", "🧠",
];

const listEl = document.getElementById("list");
const inputEl = document.getElementById("task-input");
const addBtn = document.getElementById("add-btn");
const toastEl = document.getElementById("undo-toast");
const undoBtn = document.getElementById("undo-btn");
const emojiToggle = document.getElementById("emoji-toggle");
const emojiPanel = document.getElementById("emoji-panel");

let pendingIcon = null;

function setToggleIcon(icon) {
  pendingIcon = icon;
  if (icon) {
    emojiToggle.innerHTML = `<span style="font-size:18px;">${icon}</span>`;
  } else {
    emojiToggle.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="0.7" fill="#9a9a9a" stroke="none"/><circle cx="15" cy="10" r="0.7" fill="#9a9a9a" stroke="none"/><path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8"/></svg>`;
  }
}

// A tap-vs-scroll guard: only treat it as a selection if the finger didn't
// move much between pointerdown and pointerup — otherwise a scroll gesture
// that merely starts on top of a button would fire it by accident.
function addTapHandler(el, onTap) {
  let startX = 0, startY = 0, tracking = false;
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    startX = e.clientX; startY = e.clientY; tracking = true;
  });
  el.addEventListener("pointerup", (e) => {
    if (!tracking) return;
    tracking = false;
    const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
    if (dist < 12) onTap(e);
  });
  el.addEventListener("pointercancel", () => { tracking = false; });
}

EMOJI_PICKER.forEach((emoji) => {
  const btn = document.createElement("button");
  btn.textContent = emoji;
  addTapHandler(btn, () => {
    setToggleIcon(emoji);
    emojiPanel.classList.remove("show");
  });
  emojiPanel.appendChild(btn);
});

addTapHandler(emojiToggle, () => {
  emojiPanel.classList.toggle("show");
});

function render() {
  listEl.innerHTML = "";
  tasks.forEach((task, index) => {
    listEl.appendChild(renderRow(task, index));
  });
}

function renderRow(task, index) {
  const wrap = document.createElement("div");
  wrap.className = "row-wrap";

  const row = document.createElement("div");
  row.className = "row";

  if (task.icon) {
    const emojiSlot = document.createElement("div");
    emojiSlot.className = "emoji-slot";
    emojiSlot.textContent = task.icon;
    row.appendChild(emojiSlot);
  }

  const textEl = document.createElement("div");
  textEl.className = "task-text";
  textEl.textContent = task.text;
  row.appendChild(textEl);

  wrap.appendChild(row);
  attachGestures(row, wrap, task, index);
  return wrap;
}

function attachGestures(row, wrap, task, index) {
  let dx = 0, mode = null, decided = false, startX = 0, startY = 0;
  let longPressTimer = null;
  let appliedShift = 0, startIndex = index, activePointerId = null;
  let revealEl = null;
  let safetyReleaseTimer = null;
  let scrollAnchorY = 0;

  function clearLP() { if (longPressTimer) clearTimeout(longPressTimer); longPressTimer = null; }

  row.addEventListener("pointerdown", (e) => {
    // Ignore secondary touch points (e.g. a palm brushing the screen while
    // swiping) and refuse to start a new gesture while another row already
    // has one in progress — this makes it structurally impossible for two
    // rows to ever resolve from what should be a single touch.
    if (!e.isPrimary || activeGestureId !== null) return;
    activeGestureId = task.id;
    clearTimeout(safetyReleaseTimer);
    safetyReleaseTimer = setTimeout(() => {
      if (activeGestureId === task.id) activeGestureId = null;
    }, 5000);
    row.setPointerCapture?.(e.pointerId);
    activePointerId = e.pointerId;
    startX = e.clientX; startY = e.clientY;
    decided = false; dx = 0; appliedShift = 0;
    startIndex = tasks.findIndex(t => t.id === task.id);
    mode = null;
    longPressTimer = setTimeout(() => {
      if (!decided) { decided = true; mode = "reorder"; row.style.zIndex = 5; row.style.boxShadow = "0 12px 24px rgba(0,0,0,0.5)"; }
    }, 420);
  });

  row.addEventListener("pointermove", (e) => {
    if (activePointerId === null) return;
    const deltaX = e.clientX - startX;
    const deltaY = e.clientY - startY;

    if (!decided) {
      if (Math.abs(deltaX) > 16 && Math.abs(deltaX) > Math.abs(deltaY) * 1.8) {
        decided = true; clearLP(); mode = "swipe";
      } else if (Math.abs(deltaY) > 22) {
        // Clearly a vertical scroll attempt — take over scrolling manually
        // below, since touch-action:none means the browser won't do it
        // for us. Threshold is deliberately generous: a finger held still
        // for the long-press window naturally drifts a few pixels, and too
        // low a value here was misreading that drift as a scroll before
        // reorder could ever trigger.
        decided = true; clearLP(); mode = "scrolling";
        scrollAnchorY = e.clientY;
      }
      return;
    }

    if (mode === "scrolling") {
      listEl.scrollTop -= (e.clientY - scrollAnchorY);
      scrollAnchorY = e.clientY;
      return;
    }

    if (mode === "swipe") {
      dx = deltaX;
      row.style.transform = `translateX(${dx}px)`;
      row.style.transition = "none";
      if (!revealEl) {
        revealEl = document.createElement("div");
        wrap.insertBefore(revealEl, row);
      }
      revealEl.className = "reveal " + (dx > 0 ? "right" : "left");
      const progress = Math.min(Math.abs(dx) / 110, 1);
      revealEl.innerHTML = dx > 0
        ? `<svg style="opacity:${progress};transform:scale(${0.6+0.4*progress})" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F3EF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
        : `<svg style="opacity:${progress};transform:scale(${0.6+0.4*progress})" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F3EF" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
    } else if (mode === "reorder") {
      const shift = Math.round(deltaY / ROW_PITCH);
      if (shift !== appliedShift) {
        reorderTask(task.id, startIndex + shift);
        appliedShift = shift;
      }
      const lift = deltaY - appliedShift * ROW_PITCH;
      row.style.transform = `translateY(${lift}px) scale(1.02)`;
      row.style.transition = "none";
    }
  });

  function finish() {
    clearLP();
    clearTimeout(safetyReleaseTimer);
    activePointerId = null;
    if (activeGestureId === task.id) activeGestureId = null;
    if (mode === "swipe") {
      const rowWidth = row.offsetWidth || 320;
      const threshold = rowWidth * 0.3;
      if (dx > threshold) {
        commitResolve(task.id, "tick", wrap);
        return;
      } else if (dx < -threshold) {
        commitResolve(task.id, "cross", wrap);
        return;
      } else {
        row.style.transition = "transform 0.2s ease";
        row.style.transform = "translateX(0)";
        if (revealEl) { revealEl.remove(); revealEl = null; }
      }
    }
    row.style.zIndex = "";
    row.style.boxShadow = "none";
    row.style.transition = "transform 0.2s ease";
    row.style.transform = "none";
    mode = null; decided = false;
  }

  row.addEventListener("pointerup", finish);
  row.addEventListener("pointercancel", finish);
}

function commitResolve(id, action, wrap) {
  wrap.style.transition = "opacity 0.14s ease, transform 0.14s ease";
  wrap.style.opacity = "0";
  wrap.style.transform = "scale(0.94)";
  setTimeout(() => resolveTask(id, wrap), 140);
}

function resolveTask(id, wrapEl) {
  const idx = tasks.findIndex(t => t.id === id);
  if (idx === -1) return;
  const task = tasks[idx];
  tasks = tasks.filter(t => t.id !== id);
  lastRemoved = { task, index: idx };
  showUndo();
  saveTasks();
  // Remove just this row's own element directly, rather than calling
  // render() and rebuilding every row — a full rebuild would also destroy
  // and recreate any OTHER row's DOM node, silently breaking a gesture
  // that might still be in progress on it at this exact moment.
  if (wrapEl && wrapEl.parentNode) {
    wrapEl.remove();
  } else {
    render();
  }
}

function reorderTask(id, toIndex) {
  const fromIndex = tasks.findIndex(t => t.id === id);
  if (fromIndex === -1 || fromIndex === toIndex) return;
  const clamped = Math.max(0, Math.min(toIndex, tasks.length - 1));
  const [moved] = tasks.splice(fromIndex, 1);
  tasks.splice(clamped, 0, moved);
  saveTasks();
  render();
}

function showUndo() {
  if (undoTimer) clearTimeout(undoTimer);
  toastEl.classList.add("show");
  undoTimer = setTimeout(() => {
    toastEl.classList.remove("show");
    lastRemoved = null;
  }, 5000);
}

addTapHandler(undoBtn, () => {
  if (!lastRemoved) return;
  tasks.splice(Math.min(lastRemoved.index, tasks.length), 0, lastRemoved.task);
  if (undoTimer) clearTimeout(undoTimer);
  toastEl.classList.remove("show");
  lastRemoved = null;
  saveTasks();
  render();
});

function addTask() {
  const val = inputEl.value.trim();
  if (!val) return;
  inputEl.value = "";
  tasks.unshift({ id: "t" + (uid++), text: val, icon: pendingIcon });
  setToggleIcon(null);
  emojiPanel.classList.remove("show");
  saveTasks();
  render();
}

addBtn.addEventListener("click", addTask);
inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") addTask(); });

render();

// Register service worker for offline support
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
